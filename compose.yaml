name: banana-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-h18abanana}"
      MYSQL_USER: "${MYSQL_USER:-banana}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-banana_local_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-banana_local_root_password}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_OPPORTUNITY_SOURCE_URLS: "${VITE_OPPORTUNITY_SOURCE_URLS:-true}"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    environment:
      # Container traffic always uses the backend's internal service port.
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: banana-backend:local
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-h18abanana}"
      MYSQL_USER: "${MYSQL_USER:-banana}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-banana_local_password}"
      DOCUMENT_STORAGE_DIR: /app/data/documents
      SEMANTIC_MATCHING_ENABLED: "${SEMANTIC_MATCHING_ENABLED:-true}"
      SEMANTIC_MATCHING_WEIGHT: "${SEMANTIC_MATCHING_WEIGHT:-0.3}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-10}"
    volumes:
      - backend_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  document-worker:
    image: banana-backend:local
    build: *backend-build
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    command: ["python", "-m", "flask", "--app", "backend.app", "process-documents"]
    # The image's HTTP readiness probe only applies to the web service.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-h18abanana}"
      MYSQL_USER: "${MYSQL_USER:-banana}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-banana_local_password}"
      DOCUMENT_STORAGE_DIR: /app/data/documents
      DOCUMENT_PROCESSING_TIMEOUT: "${DOCUMENT_PROCESSING_TIMEOUT:-300}"
      DOCUMENT_PROCESSING_MAX_ATTEMPTS: "${DOCUMENT_PROCESSING_MAX_ATTEMPTS:-3}"
    volumes:
      - backend_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
  mysql_data:

networks:
  default:
    driver: bridge
