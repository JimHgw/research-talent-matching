name: banana-backend

services:
  backend:
    image: banana-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/h18abanana.db
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
    volumes:
      - backend_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
