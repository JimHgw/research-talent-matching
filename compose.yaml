name: banana-backend

services:
  frontend:
    build:
      context: ./frontend
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    environment:
      # Container traffic always uses the backend's internal service port.
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: banana-backend:local
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/h18abanana.db
      DOCUMENT_STORAGE_DIR: /app/data/documents
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-10}"
    volumes:
      - backend_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  document-worker:
    image: banana-backend:local
    build: *backend-build
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    command: ["python", "-m", "flask", "--app", "backend.app", "process-documents"]
    # The image's HTTP readiness probe only applies to the web service.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: sqlite:////app/data/h18abanana.db
      DOCUMENT_STORAGE_DIR: /app/data/documents
      DOCUMENT_PROCESSING_TIMEOUT: "${DOCUMENT_PROCESSING_TIMEOUT:-300}"
      DOCUMENT_PROCESSING_MAX_ATTEMPTS: "${DOCUMENT_PROCESSING_MAX_ATTEMPTS:-3}"
    volumes:
      - backend_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:

networks:
  default:
    driver: bridge
