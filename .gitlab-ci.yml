stages:
  - test
  - build

pipeline_check:
  stage: test
  image: python:3.12-slim
  script:
    - echo "GitLab CI pipeline is working"
    - python --version

frontend_build:
  stage: build
  image: node:22

  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile

  script:
    - pnpm build