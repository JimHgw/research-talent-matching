stages:
  - test
  - build


pipeline_check:
  stage: test
  image: python:3.12-slim

  script:
    - echo "GitLab CI pipeline is working"
    - python --version


api_validation:
  stage: test
  image: python:3.12-slim

  script:
    - echo "Validating API JSON files..."

    - python -m json.tool docs/api/openapi.json > /dev/null
    - python -m json.tool docs/api/endpoint-index.json > /dev/null
    - python -m json.tool docs/api/examples/index.json > /dev/null

    - |
      python - <<'PY'
      import json
      from pathlib import Path

      files = list(Path("docs/api/examples").rglob("*.json"))

      print(f"Checking {len(files)} JSON example files...")

      if not files:
          raise SystemExit("No JSON example files found.")

      for file in files:
          with file.open(encoding="utf-8") as f:
              json.load(f)

          print(f"OK: {file}")

      print("All API JSON files are valid.")
      PY


frontend_test:
  stage: test
  image: node:22

  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile

  script:
    - pnpm test


frontend_format:
  stage: test
  image: node:22

  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile

  script:
    - pnpm format:check


frontend_backend_integration:
  stage: test
  image: python:3.12-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl xz-utils
    - |
      case "$(uname -m)" in
        x86_64) node_arch=x64 ;;
        aarch64) node_arch=arm64 ;;
        *) echo "Unsupported Node architecture"; exit 1 ;;
      esac
      node_archive="node-v22.13.0-linux-${node_arch}.tar.xz"
      curl -fsSLO "https://nodejs.org/dist/v22.13.0/${node_archive}"
      curl -fsSLo node-shasums.txt https://nodejs.org/dist/v22.13.0/SHASUMS256.txt
      grep " ${node_archive}$" node-shasums.txt | sha256sum -c -
      tar -xJf "$node_archive" --strip-components=1 --directory=/usr/local
    - npm install --global --ignore-scripts pnpm@11.25.0
    - python -m pip install -r backend/requirements-dev.txt
    - pnpm --dir frontend install --frozen-lockfile
  script:
    - python -m pytest backend/tests/test_frontend_integration.py backend/tests/test_us09_frontend_integration.py backend/tests/test_fe3_frontend_integration.py --require-frontend --durations=10

backend_test:
  stage: test
  image: python:3.12-slim
  # The shared runner enforces 10 minutes per job. Reuse the tested MySQL
  # partitioner so every collected test runs in exactly one SQLite shard.
  parallel: 3

  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt

  script:
    - python -m pytest --shard-index "$CI_NODE_INDEX" --shard-total "$CI_NODE_TOTAL" -q --durations=10 --junitxml="../reports/backend-tests-${CI_NODE_INDEX}.xml"
  artifacts:
    when: always
    reports:
      junit: reports/backend-tests-*.xml
    paths:
      - reports/backend-tests-*.xml
    expire_in: 1 week


semantic_evaluation:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -m pip install -r backend/requirements-dev.txt -r backend/requirements-semantic.txt
  script:
    - python -m backend.src.features.matching.evaluate_semantic --download-model --output reports/us13-results.json
    - python -m backend.src.features.matching.prepare_semantic
    - python -m pytest backend/tests/test_us13.py backend/tests/test_semantic_matching.py backend/tests/test_requirement_scoring.py backend/tests/test_sprint3_be7.py --require-application-model -q -rs --junitxml=reports/be7-application-model.xml
  cache:
    key: minilm-us13-1110a243-application-e8f8c211
    paths:
      - data/us13/model/
      - data/semantic/model/
  artifacts:
    when: always
    paths:
      - reports/us13-results.json
      - reports/be7-application-model.xml
    reports:
      junit: reports/be7-application-model.xml
    expire_in: 1 week

backend_mysql_test:
  stage: test
  image: python:3.12-slim
  parallel: 3
  services:
    - name: mysql:8.4
      alias: mysql
  variables:
    MYSQL_DATABASE: banana_test
    MYSQL_USER: banana
    MYSQL_PASSWORD: ci_test_password
    MYSQL_ROOT_PASSWORD: ci_test_root_password
    MYSQL_TEST_DATABASE_URL: mysql+pymysql://banana:ci_test_password@mysql:3306/banana_test
  before_script:
    - python -m pip install -r backend/requirements-dev.txt
    - |
      python - <<'PY'
      import os, time
      from sqlalchemy import create_engine
      engine = create_engine(os.environ['MYSQL_TEST_DATABASE_URL'])
      for attempt in range(60):
          try:
              with engine.connect() as connection:
                  connection.exec_driver_sql('SELECT 1')
              break
          except Exception:
              if attempt == 59:
                  raise
              time.sleep(2)
      engine.dispose()
      PY
  script:
    - python -m pytest backend/tests --run-mysql --shard-index "$CI_NODE_INDEX" --shard-total "$CI_NODE_TOTAL" -q --durations=10 --junitxml=reports/mysql-tests.xml
  artifacts:
    when: always
    reports:
      junit: reports/mysql-tests.xml
    paths:
      - reports/mysql-tests.xml
    expire_in: 1 week

frontend_build:
  stage: build
  image: node:22

  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile

  script:
    - pnpm build
